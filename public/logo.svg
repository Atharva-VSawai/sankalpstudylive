<?xml version="1.0" encoding="utf-8"?>
<!-- Sankalp Study Live — the "resolve" mark. A rounded square with the
     green→gold brand gradient and a stylized mountain/tent + seedling shape.
     Used as the favicon and PWA icon. Inline SVG stays crisp at any size. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 32 32" enable-background="new 0 0 32 32" xml:space="preserve">
  <defs>
    <linearGradient id="sankalpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- brand-emerald: oklch(0.58 0.15 160) ≈ #0e8a5b; brand-saffron: oklch(0.72 0.16 70) ≈ #e0a02a -->
      <stop offset="0%" stop-color="#0e8a5b"/>
      <stop offset="100%" stop-color="#e0a02a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background with the brand gradient -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#sankalpGrad)"/>
  <!-- The "resolve" mark: a mountain/tent peak (white) + a seedling dot -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 25h18"/>
    <path d="M8.5 25c0-6 3.5-11 7.5-11s7.5 5 7.5 11"/>
  </g>
  <path d="M16 7c1.5 1.5 1.5 3.5 0 5-1.5-1.5-1.5-3.5 0-5Z" fill="#ffffff"/>
</svg>
